version: '3.8'

services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: vortexym-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"   # HTTP API
      - "7881:7881"   # WebSocket
      - "7882:7882/udp" # UDP for WebRTC
      - "7883:7883/udp" # UDP for WebRTC
      - "7884:7884/udp" # UDP for WebRTC
      - "7885:7885/udp" # UDP for WebRTC
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LIVEKIT_KEYS=${LIVEKIT_API_KEY}
      - LIVEKIT_SECRETS=${LIVEKIT_API_SECRET}
    volumes:
      - ./uploads/recordings:/home/livekit/recordings
    depends_on:
      - redis
    networks:
      - vortexym-network

  redis:
    image: redis:7-alpine
    container_name: vortexym-redis-livekit
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - vortexym-network

volumes:
  redis-data:

networks:
  vortexym-network:
    driver: bridge
