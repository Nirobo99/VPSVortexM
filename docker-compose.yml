
services:
  postgres:
    image: postgres:15
    container_name: vortexym_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vortexym
      POSTGRES_USER: vortexym_user
      POSTGRES_PASSWORD: vortexym_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: vortexym_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: